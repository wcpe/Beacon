# Beacon 可复用 RC 构建：只构建并发布 GitHub 产品资产。
name: 可复用发布构建

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: "门禁后创建的不可变 RC tag"
        required: true
        type: string

permissions: {}

jobs:
  meta:
    name: 解析发布元数据
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      commit: ${{ steps.calc.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0
      - name: 校验版本、RC tag 与提交
        id: calc
        shell: sh
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          sh scripts/release/release_check.sh check \
            --version-file VERSION \
            --rc-tag "$CANDIDATE_TAG" \
            --ga-tag "v$version"
          commit="$(git rev-parse HEAD^{commit})"
          test "$(git rev-parse "${CANDIDATE_TAG}^{commit}")" = "$commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  web:
    name: 前端构建
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 构建内嵌 Web
        run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

  binaries:
    name: 控制面 ${{ matrix.target }}
    needs: [meta, web]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, ext: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: "" }
          - { os: windows-latest, target: windows-amd64, ext: ".exe" }
          - { os: macos-14, target: darwin-arm64, ext: "" }
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: 构建控制面
        shell: sh
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          ldflags="-s -w -X github.com/wcpe/Beacon/apps/server/internal/version.Version=${VER}"
          out="beacon-${VER}-${{ matrix.target }}${{ matrix.ext }}"
          go build -trimpath -ldflags "$ldflags" -o "$out" ./apps/server/cmd/beacon
          test "$("./$out" --version)" = "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.target }}
          path: beacon-*
          if-no-files-found: error

  java:
    name: Agent 与 Maven 产品
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 Agent 产品
        shell: sh
        env:
          PAYLOAD_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          make agent
          test -s "dist/BeaconAgent-${PAYLOAD_VERSION}.jar"
          test -s "dist/BeaconAgentProxy-${PAYLOAD_VERSION}.jar"
      - name: 组装 Maven 产品 ZIP
        shell: sh
        env:
          PAYLOAD_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          if ! command -v zip >/dev/null 2>&1; then
            echo "::error::缺少 zip 命令，无法组装 Maven 产品 ZIP"
            exit 1
          fi
          stage="$GITHUB_WORKSPACE/maven-staging"
          bundle="$GITHUB_WORKSPACE/beacon-maven-${PAYLOAD_VERSION}.zip"
          mkdir -p "$stage"
          export BEACON_PUBLISH_URL="file://${stage}"
          (
            cd apps/agent
            ./gradlew \
              :agent-api:publishMavenPublicationToBeaconRemoteRepository \
              :agent-kit:publishMavenPublicationToBeaconRemoteRepository \
              --no-daemon
          )
          if test -z "$(find "$stage" -type f -print -quit)"; then
            echo "::error::Maven 暂存目录为空，拒绝生成产品 ZIP"
            exit 1
          fi
          (
            cd "$stage"
            zip -q -r "$bundle" .
          )
          test -s "$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-java-products
          path: |
            dist/BeaconAgent-${{ needs.meta.outputs.version }}.jar
            dist/BeaconAgentProxy-${{ needs.meta.outputs.version }}.jar
            beacon-maven-${{ needs.meta.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: 汇总并发布 RC
    needs: [meta, binaries, java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: beacon-linux-amd64
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: beacon-linux-arm64
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: beacon-windows-amd64
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: beacon-darwin-arm64
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: beacon-java-products
          path: downloaded
      - name: 固化产品资产
        shell: sh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          mkdir artifacts
          for name in \
            "beacon-${VERSION}-linux-amd64" \
            "beacon-${VERSION}-linux-arm64" \
            "beacon-${VERSION}-windows-amd64.exe" \
            "beacon-${VERSION}-darwin-arm64" \
            "BeaconAgent-${VERSION}.jar" \
            "BeaconAgentProxy-${VERSION}.jar" \
            "beacon-maven-${VERSION}.zip"
          do
            source="downloaded/$name"
            test -f "$source"
            cp "$source" "artifacts/$name"
          done
          (
            cd artifacts
            sha256sum \
              "beacon-${VERSION}-linux-amd64" \
              "beacon-${VERSION}-linux-arm64" \
              "beacon-${VERSION}-windows-amd64.exe" \
              "beacon-${VERSION}-darwin-arm64" \
              "BeaconAgent-${VERSION}.jar" \
              "BeaconAgentProxy-${VERSION}.jar" \
              "beacon-maven-${VERSION}.zip" \
              > SHA256SUMS.txt
          )
      - name: 校验 RC 产品
        shell: sh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RC_TAG: ${{ needs.meta.outputs.tag }}
          RC_COMMIT: ${{ needs.meta.outputs.commit }}
        run: |
          set -eu
          make release-verify-rc \
            RELEASE_RC_TAG="$RC_TAG" \
            RELEASE_GA_TAG="v$VERSION" \
            RELEASE_ASSETS_DIR=artifacts \
            RELEASE_RC_COMMIT="$RC_COMMIT"
      - name: 生成 RC 发布正文
        shell: sh
        env:
          RC_TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          {
            printf 'Beacon %s RC。\n\n' "$VERSION"
            printf '%s 指向同一 master 提交，资产由 SHA256SUMS.txt 严格校验。\n' "$RC_TAG"
          } > release-body.md
      - name: 创建 RC Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: artifacts/*
          prerelease: true
          body_path: release-body.md
          fail_on_unmatched_files: true
