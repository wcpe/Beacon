# Beacon 持续集成门禁：PR 只执行质量任务，master 全绿后生成短期开发产物。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支新推送自动取消旧的在跑流水线，节省 CI 资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Go 构建、单测与静态检查合并为一个必需质量任务。
  lint:
    name: Go 构建、测试与静态检查
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建全部包
        run: go build ./...
      - name: 运行单元测试
        run: go test ./...
      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: ./...
      - name: 校验 gofmt 格式
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi
      - name: 校验 goimports 导入分组
        shell: bash
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          unsorted=$("$(go env GOPATH)/bin/goimports" -l .)
          if [ -n "$unsorted" ]; then
            echo "以下文件未通过 goimports 导入排序："
            echo "$unsorted"
            exit 1
          fi

  # 两套前端工作区及假后端 E2E 统一纳入 Web 质量任务。
  web:
    name: Web 静态检查、测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: 安装根工作区依赖
        run: pnpm install --frozen-lockfile
      - name: 校验 UI 控件博物馆覆盖率
        run: pnpm run check:ui-wiki
      - name: 运行根工作区静态检查、测试与构建
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
      - name: 安装旧版前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 运行旧版前端静态检查
        working-directory: web
        run: pnpm lint
      - name: 校验旧版前端格式
        working-directory: web
        run: pnpm format:check
      - name: 运行旧版前端测试与覆盖率门禁
        working-directory: web
        run: pnpm test:coverage
      - name: 构建内嵌前端
        run: make web
      - name: 安装 Playwright 浏览器
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: 运行假后端前端 E2E
        working-directory: web
        run: pnpm test:e2e

  # Agent 格式、静态检查与单测保持为独立必需质量任务。
  agent:
    name: Agent 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 运行 Agent 格式、静态检查与测试
        run: ./apps/agent/gradlew -p apps/agent ktlintCheck detekt test --no-daemon

  # 使用真实 MySQL 与 Redis 验证控制面和 Agent 的集成路径。
  integration:
    name: 真实 MySQL 与 Redis 集成测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: beacon
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CGO_ENABLED: "1"
      BEACON_REDIS_TEST_HOST: 127.0.0.1
      BEACON_REDIS_TEST_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 JDK21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 配置临时 MySQL 测试连接
        shell: bash
        run: |
          set -euo pipefail
          # 提高连接上限，避免并行集成包累计连接触发 Error 1040
          mysqladmin --protocol=TCP -h 127.0.0.1 -P 3306 -u root ping --silent
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -e "SET GLOBAL max_connections = 500;"
          printf '%s\n' 'BEACON_TEST_DSN=root:@tcp(127.0.0.1:3306)/beacon?charset=utf8mb4&parseTime=True&loc=UTC&multiStatements=true' >> "$GITHUB_ENV"
      - name: 运行真实 MySQL 集成测试
        run: >-
          go test -tags=integration -p 1
          ./apps/server/internal/handler
          ./apps/server/internal/repository
          ./apps/server/internal/server
          ./apps/server/internal/service
          -count=1
      - name: 运行真实 Redis 集成测试
        run: ./apps/agent/gradlew -p apps/agent test --no-daemon
      - name: 确认真实 Redis 测试未跳过
        run: >-
          python scripts/release/assert_test_gate.py junit
          --glob 'apps/agent/**/build/test-results/test/TEST-*.xml'
          --expected-class 'top.wcpe.beacon.agent.adapters.messaging.RedisMessageTransportIntegrationTest'

  # master 的四个质量任务全部成功后，按原生平台运行现有一键打包入口。
  package:
    name: 临时开发打包（${{ matrix.target }}）
    needs: [lint, web, agent, integration]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-amd64 }
          - { os: macos-14, target: darwin-arm64 }
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 安装 JDK21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装 Windows GNU Make
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: choco install make --no-progress -y
      - name: 一键打包
        shell: bash
        run: make package
      - name: 上传临时开发产物
        uses: actions/upload-artifact@v4
        with:
          name: beacon-ci-${{ github.sha }}-${{ matrix.target }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # 最终门禁明确区分 PR 的跳过打包与 master 的完整打包成功。
  quality-gate:
    name: 最终质量门禁
    needs: [lint, web, agent, integration, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 校验质量任务与打包结果
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          LINT_RESULT: ${{ needs.lint.result }}
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} 未成功，实际结果为 ${result}"
              exit 1
            fi
          }

          require_success "Go 质量任务" "$LINT_RESULT"
          require_success "Web 质量任务" "$WEB_RESULT"
          require_success "Agent 质量任务" "$AGENT_RESULT"
          require_success "集成质量任务" "$INTEGRATION_RESULT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PACKAGE_RESULT" != "skipped" ]; then
              echo "::error::PR 的打包任务必须跳过，实际结果为 ${PACKAGE_RESULT}"
              exit 1
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$SOURCE_REF" = "refs/heads/master" ]; then
            require_success "四平台打包任务" "$PACKAGE_RESULT"
            exit 0
          fi

          echo "::error::不支持的 CI 事件：${EVENT_NAME} ${SOURCE_REF}"
          exit 1
