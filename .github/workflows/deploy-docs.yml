# 文档站部署：仅在 master 上构建并发布到 GitHub Pages。
#
# 触发面收窄到只关心站内内容（使用文档 + 站点源码），因此它既不会因改代码而空跑，
# 也不会阻塞代码 PR（部署失败不影响任何质量门禁）。
#
# 前置（一次性人工设置）：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'docs/OPERATIONS.md'
      - 'docs/SDK.md'
      - 'docs/images/**'
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      # 注意：job 已设 working-directory: website，action-setup 会沿用该目录安装，
      # 故此处不能再传 dest（否则解析成 website/website）。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建站点
        run: pnpm build

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
