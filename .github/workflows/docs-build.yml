# 文档站构建门禁：PR 与 push 都跑，只验证「站点能构建成功」，不部署。
#
# 与 deploy-docs.yml 分开是官方建议：若把 build 与 deploy 写在同一个 workflow，
# 部署 job 在 PR 上恒为 skipped，会污染 PR 的 check suite 状态。
name: Docs Build

on:
  pull_request:
    paths:
      - 'docs/wiki/**'
      - 'docs/OPERATIONS.md'
      - 'docs/SDK.md'
      - 'docs/images/**'
      - 'website/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'docs/OPERATIONS.md'
      - 'docs/SDK.md'
      - 'docs/images/**'
      - 'website/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 文档站构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      # 注意：job 已设 working-directory: website，action-setup 会沿用该目录安装，
      # 故此处不能再传 dest（否则解析成 website/website）。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 内容护栏：站点只允许收录面向使用者的文档。若内部文档（含 FR / ADR 编号）
      # 意外进入站点产物，此处直接失败——避免内部内容通过文档站对外暴露。
      - name: 构建站点
        run: pnpm build

      - name: 校验站点未收录内部内容
        run: |
          set -euo pipefail
          # 文档集篇数校验：当前版与各冻结快照的篇数**各自独立**核对。
          #
          # 为什么不能沿用「总数取模」的写法：取模隐含「各文档集篇数相等」这一前提，
          # 而新增/删除 wiki 页后当前版会比旧快照多（或少）一篇，此时总数永远不可能被
          # 任何统一基数整除——它会把「内容正常」误报成失败，且无法指出到底哪份文档集不对。
          #
          # 现在的判据：分别数当前版与每个快照，逐份与期望值比对，期望值取自仓库真实文件
          # （docs/wiki/*.md + OPERATIONS.md + SDK.md，以及各 versioned_docs/version-*/ 的内容），
          # 因此「有文档没被收录进站」会被精确抓出，而新增文档时**无需改这个脚本**。
          REPO_ROOT="$(cd .. && pwd)"
          # 当前版期望篇数 = 仓库 wiki 页数 + OPERATIONS + SDK（后者不在 wiki/ 下，是顶层两个 md）
          expected_current=$(( $(find "$REPO_ROOT/docs/wiki" -name '*.md' | wc -l) + 2 ))

          # 产物布局：当前版在 build/docs 顶层（wiki/ 子目录 + 两个顶层 html），
          # 冻结快照在 build/docs/<版本号>/（注意目录名是版本号而非 version-<版本号>）。
          # 故「当前版」= 排除所有 <版本号>/ 目录后的 html。
          SNAPSHOT_DIRS=$(cd build/docs && for d in */; do
            d="${d%/}"
            if [ -d "$REPO_ROOT/website/versioned_docs/version-$d" ]; then
              printf '%s\n' "$d"
            fi
          done)

          if [ -n "$SNAPSHOT_DIRS" ]; then
            # 用数组承载排除条件：直接拼进字符串再不加引号展开，会被 shell 当成文件列表（路径含 html 时尤其危险）
            find_args=(build/docs -name '*.html')
            for d in $SNAPSHOT_DIRS; do
              find_args+=(-not -path "build/docs/$d/*")
            done
            actual_current=$(find "${find_args[@]}" | wc -l)
          else
            actual_current=$(find build/docs -name '*.html' | wc -l)
          fi

          echo "当前版：期望 $expected_current 篇，实际 $actual_current 篇（快照目录：${SNAPSHOT_DIRS:-无}）"

          fail=0
          if [ "$actual_current" -ne "$expected_current" ]; then
            echo "::error::当前版文档页数不符（期望 $expected_current，实际 $actual_current）"
            echo "请检查 docusaurus.config.ts 的 include 白名单（wiki/** 与 OPERATIONS/SDK）是否漏收录，或 sidebars.ts 是否漏登记"
            fail=1
          fi

          # 每个冻结快照：期望 = 该快照目录里的 md 总数（快照内已含其 OPERATIONS/SDK 的副本，无需再加）
          for d in $SNAPSHOT_DIRS; do
            vdir="$REPO_ROOT/website/versioned_docs/version-$d"
            expected_v=$(find "$vdir" -name '*.md' | wc -l)
            actual_v=$(find "build/docs/$d" -name '*.html' | wc -l)
            echo "快照 $d：期望 $expected_v 篇，实际 $actual_v 篇"
            if [ "$actual_v" -ne "$expected_v" ]; then
              echo "::error::快照 $d 页数不符（期望 $expected_v，实际 $actual_v）"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "文档集篇数校验通过"
          # 内部编号零容忍
          if grep -rlE 'FR-[0-9]{2,}|ADR-[0-9]{3,}' build/ >/dev/null 2>&1; then
            echo "::error::站点产物出现内部需求 / 决策编号"
            grep -rlE 'FR-[0-9]{2,}|ADR-[0-9]{3,}' build/ | head -20
            exit 1
          fi
          # 内部文档路径零容忍
          if grep -rlE 'docs/(specs|adr)/' build/ >/dev/null 2>&1; then
            echo "::error::站点产物出现内部文档路径"
            grep -rlE 'docs/(specs|adr)/' build/ | head -20
            exit 1
          fi
          echo "内容护栏校验通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: website/build
          retention-days: 7
