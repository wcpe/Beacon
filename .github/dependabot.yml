# 依赖自动更新配置：每周小批量提 PR，全部经 PR 门禁合入 master，不直推。
version: 2
updates:
  # 根 go.mod 的 Go 模块依赖（对应根 go.mod / go.sum）
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  # apps/agent 的 Gradle 依赖（对应 apps/agent/build.gradle.kts，含 gradle wrapper）
  - package-ecosystem: "gradle"
    directory: "/apps/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ── Kotlin 全家桶：全版本锁定，禁止任何升级 ──
      # 本项目必须固定在 Kotlin 1.9.22，以适配低版本 Minecraft 服务端：
      # 1) 字节码目标 jvmTarget 1.8（旧版 MC 服务端可加载）
      # 2) 运行期 stdlib 由 TabooLib 以 kotlin1922 重定位供给（见 BeaconAgentBukkit.kt
      #    的 @RuntimeDependencies relocate 规则）——升 Kotlin 会让构建期版本与
      #    运行期重定位规则脱节，即便编译通过也会在运行期缺符号
      # 3) detekt / ktlint 等静态检查插件按 Kotlin 1.9.x 配置
      # 故拦截「全部」更新，不只是大版本。
      #
      # 名称形式说明：Dependabot 对 Gradle 插件按简称报告（PR 标题即 "jvm" /
      # "plugin.serialization"），同时也存在 group:artifact 形式。为免漏拦，
      # 简称、完整坐标与通配三种形式一并列出。
      - dependency-name: "jvm"
      - dependency-name: "plugin.serialization"
      - dependency-name: "org.jetbrains.kotlin.jvm:*"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization:*"
      # 匹配 org.jetbrains.kotlin:*（stdlib / reflect 等）与
      # org.jetbrains.kotlinx:*（serialization / coroutines 等整条生态线）
      - dependency-name: "org.jetbrains.kotlin*"

      # ── 受 Kotlin 1.9.22 连带约束的依赖：只拦大版本 ──
      # okhttp 5.x 全系列要求 Kotlin 2.x 元数据（5.0.0/5.1.0 → stdlib 2.2.0，
      # 5.2.0 → 2.2.20，5.3.0/5.5.0 → 2.2.21）。4.x 线的补丁与次要更新照常收。
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      # Gradle 9.x 要求 KGP 2.3.0 以上（9.7 需 2.4.20），与 Kotlin 锁定冲突。
      # 8.x 线的补丁与次要更新照常收。
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

      # ── JUnit：全版本锁定在 5.x ──
      # JUnit 6 的基线是 Java 17 + Kotlin 2.1（见 6.0.0 release notes 的 Scope），
      # 而本项目为 jvmTarget 1.8 + Kotlin 1.9.22 双重约束：Java 17 基线使测试
      # 字节码无法在 Java 8 目标下运行，Kotlin 2.1 基线又与 Kotlin 锁定冲突。
      # 故拦截全部更新，理由与 Kotlin 锁定同源（低版本 MC 服务端适配）。
      - dependency-name: "org.junit.jupiter:junit-jupiter"
      - dependency-name: "org.junit.jupiter:*"
      - dependency-name: "org.junit.platform:*"
  # 根 pnpm workspace 的前端依赖（对应根 package.json / pnpm-lock.yaml）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ── msw 3.x：破坏性升级，且与当前 vitest 的 mocker 不兼容 ──
      # 本地实测（2026-10-06，基于当日 master）：仅改版本号会 typecheck 失败 2 处
      # （msw 3 移除 onUnhandledRequest），且 pnpm test 有 32/50 个测试文件失败。
      # 另有两处 peer 冲突：msw 3 要求 typescript >=5.9（本仓 5.6.3）、
      # vitest 5.0.1 的 @vitest/mocker 要求 msw ^2.4.9（不认 3.x）。
      # 升级需先适配新 API 并解决与 vitest 的 peer 冲突（可能要连带升 vitest），
      # 待上游生态对齐后手动评估。只拦 3.x，2.x 的补丁更新照常提。
      - dependency-name: "msw"
        versions: [">=3.0.0"]
      # ── typescript 6.x：typescript-eslint 与 tsc 的类型推断不一致 ──
      # 本地实测（2026-10-06）：typecheck / test(544) / build 全过，仅 lint 失败 2 处
      # （@typescript-eslint/no-unnecessary-condition 对 HTMLElement.textContent 的可空性
      # 判成 string，而 tsc 在 strict 下正确判成 string | null）。三条规则互相封死：
      # 保留 ?. 被说多余、改 ?? '' 被说左侧不该为 null、改 String() 被说无意义。
      # 已验证与其它依赖升级无关——回滚 typescript 到 5.6.3 后 lint 立即通过。
      # 待 typescript-eslint 修好与 TS 6 的一致后再升。只拦 6.x，5.x 照常提。
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
  # 工作流引用的 GitHub Actions（对应 .github/workflows/*.yml）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
