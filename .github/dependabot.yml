# 依赖自动更新配置：每周小批量提 PR，全部经 PR 门禁合入 master，不直推。
version: 2
updates:
  # 根 go.mod 的 Go 模块依赖（对应根 go.mod / go.sum）
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  # apps/agent 的 Gradle 依赖（对应 apps/agent/build.gradle.kts，含 gradle wrapper）
  - package-ecosystem: "gradle"
    directory: "/apps/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # okhttp 5.x 全系列要求 Kotlin 2.x 元数据，而本工程 Kotlin 固定 1.9.22，
      # 且运行期 Kotlin 由 TabooLib 以 kotlin1922 重定位供给（见 BeaconAgentBukkit.kt
      # 的 @RuntimeDependencies relocate 规则）——即便绕过编译期检查，运行期仍会
      # 因缺 Kotlin 2.x 符号而失败。升 Kotlin 2.x 牵动 TabooLib 兼容性、jvmTarget 1.8
      # 与运行期重定位，属架构级决策。故只拦大版本，4.x 线的补丁与次要更新照常收。
      # 待 Kotlin 升到 2.x 后移除此项。
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      # Gradle 9.x 要求 Kotlin Gradle Plugin 2.3.0 以上（Gradle 9.7 需 KGP 2.4.20），
      # 与上面 okhttp 同源：都卡在 Kotlin 1.9.22。同样只拦大版本。
      # 待 Kotlin 升到 2.x 后移除此项。
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
  # 根 pnpm workspace 的前端依赖（对应根 package.json / pnpm-lock.yaml）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  # 工作流引用的 GitHub Actions（对应 .github/workflows/*.yml）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
