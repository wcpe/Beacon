# Beacon 控制面 Go 静态检查配置（golangci-lint v2）。
# CI 门禁：未过不允许合并。规则见 .claude/rules/static-analysis.md。
version: "2"

linters:
  # FR-176：以 all 档为基线，禁用项集中声明并说明原因。
  default: all
  disable:
    # 与本仓中文注释 / 中文测试名 / 运维中文文案冲突。
    - asciicheck
    - godot
    - gosmopolitan
    - misspell

    # 主观格式 / 排版类规则：本仓格式由 gofmt + goimports + CRLF 安全脚本单一负责。
    - decorder
    - dogsled
    - embeddedstructfieldcheck
    - funcorder
    - goheader
    - grouper
    - lll
    - nlreturn
    - tagalign
    - whitespace
    - wsl
    - wsl_v5

    # 与现有架构取舍冲突或要求大面积重构 Legacy 存量代码。
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - err113
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - godoclint
    - iface
    - inamedparam
    - interfacebloat
    - ireturn
    - nolintlint
    - maintidx
    - mnd
    - musttag
    - nilnil
    - noinlineerr
    - noctx
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - recvcheck
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - wastedassign
    - wrapcheck

    # 不适用于当前技术栈或已有更窄的本地门禁覆盖。
    - arangolint
    - clickhouselint
    - ginkgolinter
    - gomodguard
    - gomodguard_v2
    - gosec
    - intrange
    - loggercheck
    - modernize
    - protogetter
    - sloglint
    - spancheck
    - testifylint
    - zerologlint

  # 排除规则：沿用 v2 迁移默认（生成文件宽松匹配 + 若干预置误报豁免）
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # exported-stutter 豁免：merge.MergeDataID / MergeDataIDWithProvenance / filetree.FileTreeMD5 等
      # 命名由 ADR-0013 锁定（明写「MergeDataID 一字不改」），不为消除 stutter 改名；仅豁免 stutter 子检查，revive 其余规则保留
      - linters:
          - revive
        text: that stutters
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  # 单个 linter 报告条数不设上限（0 = 不限），全部暴露不折叠
  max-issues-per-linter: 0
  # 相同问题不折叠（0 = 不限）
  max-same-issues: 0

# Go 格式化由 CI 的 gofmt/goimports 步骤与本地 `make lint` 的 CRLF 安全脚本负责。
